<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Desttex — Creative technology</title>
  <desc id="description">A dark navy banner with a large Desttex wordmark and a colorful geometric composition in violet, cyan, and coral.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131929"/><stop offset="1" stop-color="#0B0F1D"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D3A7FF"/><stop offset=".5" stop-color="#9677FA"/><stop offset="1" stop-color="#5FE4E7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#BFA0FF"/><stop offset=".55" stop-color="#5FE4E7"/><stop offset="1" stop-color="#FF998B"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#background)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="4" fill="url(#accent)"/>
    <path d="M785 0V420" stroke="#FFFFFF" stroke-opacity=".07"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="65" cy="60" r="5" fill="#68E5DF"/>
      <text x="83" y="65" fill="#C1C7D7" font-size="15" letter-spacing="3">GITHUB / WDEST</text>
      <text x="53" y="229" fill="#F7F5FF" font-size="112" font-weight="700" letter-spacing="-6">Desttex<tspan fill="#C2A0FF">.</tspan></text>
      <text x="62" y="282" fill="#A8B2CD" font-size="20" letter-spacing="4">CREATIVE TECHNOLOGY</text>
      <path d="M62 335H108" stroke="#68E5DF" stroke-width="3"/>
      <text x="125" y="342" fill="#D5DAE8" font-size="17">Ideas. Creativity. Possibility.</text>
    </g>
    <g transform="translate(1040 209)">
      <circle r="142" fill="none" stroke="#303748" stroke-width="1"/>
      <circle r="121" fill="none" stroke="url(#ring)" stroke-width="46"/>
      <path d="M-23 -52L36 0L-23 52" fill="none" stroke="#F4F1FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="116" cy="-104" r="23" fill="#FF998B"/>
      <rect x="-155" y="76" width="52" height="52" rx="12" fill="#68E5DF" transform="rotate(-12 -129 102)"/>
      <path d="M91 124H119M105 110V138" stroke="#C2A0FF" stroke-width="5" stroke-linecap="round"/>
      <path d="M-151 -114H-131M-141 -124V-104" stroke="#68E5DF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="171" cy="40" r="5" fill="#C2A0FF"/>
    </g>
  </g>
</svg>
