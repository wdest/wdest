<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
<title id="title">Desttex — Ideas in motion</title>
<desc id="description">A dark creative-technology banner with a rotating violet and cyan orbit, gently floating geometric shapes, and an animated typing line.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121B2C"/><stop offset="1" stop-color="#080C18"/></linearGradient>
<linearGradient id="orbit"><stop stop-color="#CDA4FF"/><stop offset=".5" stop-color="#8D83FF"/><stop offset="1" stop-color="#57E5E1"/></linearGradient>
<linearGradient id="line"><stop stop-color="#BCA1FF"/><stop offset=".55" stop-color="#64E7DE"/><stop offset="1" stop-color="#FFA08C"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8463D9" stop-opacity=".22"/><stop offset="1" stop-color="#8463D9" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
<clipPath id="outer"><rect width="1280" height="440" rx="24"/></clipPath>
<clipPath id="typing"><rect x="90" y="314" width="460" height="36"><animate attributeName="width" values="0;460;460;0" keyTimes="0;.38;.88;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#outer)">
<rect width="1280" height="440" fill="url(#bg)"/>
<rect width="1280" height="440" fill="url(#grid)"/>
<rect width="1280" height="4" fill="url(#line)"/>
<circle cx="1010" cy="220" r="260" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="60" y="44" width="222" height="35" rx="17.5" fill="#172738" stroke="#31545D"/>
<circle cx="80" cy="61.5" r="4" fill="#66E6D9"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle>
<text x="96" y="67" fill="#ADDAD9" font-size="13" letter-spacing="2">THE WDEST WORKSPACE</text>
<text x="54" y="224" fill="#F6F4FF" font-size="118" font-weight="700" letter-spacing="-6">Desttex<tspan fill="#BCA1FF">.</tspan></text>
<text x="63" y="272" fill="#A8B3CE" font-size="20" letter-spacing="4">CREATIVE TECHNOLOGY</text>
<rect x="60" y="307" width="557" height="55" rx="10" fill="#0A1120" stroke="#243044"/>
<text x="75" y="341" fill="#63E7D9" font-family="monospace" font-size="22">&gt;</text>
<text x="98" y="341" clip-path="url(#typing)" fill="#E0DEED" font-family="monospace" font-size="21">ideas in motion. always exploring.</text>
<text x="62" y="405" fill="#70809E" font-size="12" letter-spacing="3">IMAGINE &#183; CREATE &#183; EXPLORE</text>
</g>
<g transform="translate(1000 223)">
<circle r="155" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>
<circle r="183" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-dasharray="3 13"/>
<g>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
<circle r="118" fill="none" stroke="url(#orbit)" stroke-width="38" stroke-dasharray="545 197" stroke-linecap="round"/>
<circle cx="155" cy="0" r="12" fill="#FFA08C"/>
<circle cx="-155" cy="0" r="6" fill="#5CE4DF"/>
</g>
<circle r="79" fill="#0B1120" stroke="#292A49"/>
<path d="M-17 -31L18 0L-17 31" fill="none" stroke="#F5F1FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
<rect x="-184" y="80" width="48" height="48" rx="12" fill="#66E6DE" transform="rotate(-15 -160 104)"/>
<path d="M126 -132H154M140 -146V-118" stroke="#C8A5FF" stroke-width="5" stroke-linecap="round"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="7s" repeatCount="indefinite"/>
<circle cx="-155" cy="-121" r="8" fill="#C8A5FF"/>
<path d="M132 132H152M142 122V142" stroke="#66E6DE" stroke-width="3" stroke-linecap="round"/>
</g>
</g>
</g>
</svg>